# Compact execution-ready contract for durable Execution Brief artifacts.
# Semantic sufficiency remains a review responsibility. YAML frontmatter value
# checks are enforced by scripts/validate_execution_brief.mjs.
syntaxVersion: markdown-engine.validation@v1
documentVersion: 1.0.0
rules:
  - id: frontmatter.required
    select:
      target: document
    assert:
      frontmatterRequired:
        fields:
          - title
          - brief_id
          - artifact_version
          - status
          - created_at
          - updated_at
          - target_repo
          - target_branch
          - review_boundary_id

  - id: sections.required
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Objective
          - Context / Constraints
          - Authoritative Sources
          - Current State
          - Execution Scope
          - Materially Verifiable Success Criteria
          - Review Boundary
          - Planned Follow-up Work
          - Execution Plan
          - Validation Gates
          - Stop Conditions
          - Review Packet Inputs
          - Revision Log

  - id: document.length.compact
    select:
      target: document
    assert:
      textLength:
        max: 18000

  - id: objective.length.compact
    select:
      target: section
      title: Objective
    assert:
      textLength:
        min: 20
        max: 700

  - id: context.constraints.list
    select:
      target: list
      section: Context / Constraints
      ordered: false
    assert:
      textLength:
        min: 10

  - id: authoritative.sources.table
    select:
      target: table
      section: Authoritative Sources
      header:
        - Source
        - Retrieved at
        - Authority
        - Status
        - Controls
    assert:
      tableColumnsRequired:
        columns:
          - Source
          - Retrieved at
          - Authority
          - Status
          - Controls

  - id: authoritative.sources.rows
    select:
      target: tableRow
      section: Authoritative Sources
      tableHeader:
        - Source
        - Retrieved at
        - Authority
        - Status
        - Controls
    assert:
      textLength:
        min: 10

  - id: current.state.list
    select:
      target: list
      section: Current State
      ordered: false
    assert:
      textLength:
        min: 10

  - id: execution.scope.table
    select:
      target: table
      section: Execution Scope
      header:
        - Scope item
        - Classification
        - Approval impact
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Scope item
          - Classification
          - Approval impact
          - Notes

  - id: execution.scope.rows
    select:
      target: tableRow
      section: Execution Scope
      tableHeader:
        - Scope item
        - Classification
        - Approval impact
        - Notes
    assert:
      textLength:
        min: 10

  - id: success.criteria.list
    select:
      target: list
      section: Materially Verifiable Success Criteria
      ordered: false
    assert:
      textLength:
        min: 10

  - id: review.boundary.table
    select:
      target: table
      section: Review Boundary
      header:
        - Boundary
        - Scope
        - Approval impact
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Boundary
          - Scope
          - Approval impact
          - Notes

  - id: review.boundary.rows
    select:
      target: tableRow
      section: Review Boundary
      tableHeader:
        - Boundary
        - Scope
        - Approval impact
        - Notes
    assert:
      textLength:
        min: 10

  - id: planned.followup.list
    select:
      target: list
      section: Planned Follow-up Work
      ordered: false
    assert:
      textLength:
        min: 10

  - id: execution.plan.ordered-list
    select:
      target: list
      section: Execution Plan
      ordered: true
    assert:
      textLength:
        min: 10

  - id: validation.gates.list
    select:
      target: list
      section: Validation Gates
      ordered: false
    assert:
      textLength:
        min: 10

  - id: stop.conditions.list
    select:
      target: list
      section: Stop Conditions
      ordered: false
    assert:
      textLength:
        min: 10

  - id: review.packet.inputs.table
    select:
      target: table
      section: Review Packet Inputs
      header:
        - Field
        - Source section
        - Required mapping
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Field
          - Source section
          - Required mapping
          - Notes

  - id: review.packet.inputs.rows
    select:
      target: tableRow
      section: Review Packet Inputs
      tableHeader:
        - Field
        - Source section
        - Required mapping
        - Notes
    assert:
      textLength:
        min: 10

  - id: revision.log.table
    select:
      target: table
      section: Revision Log
      header:
        - Timestamp
        - Actor
        - Change
        - Checksum
    assert:
      tableColumnsRequired:
        columns:
          - Timestamp
          - Actor
          - Change
          - Checksum

  - id: revision.log.rows
    select:
      target: tableRow
      section: Revision Log
      tableHeader:
        - Timestamp
        - Actor
        - Change
        - Checksum
    assert:
      textLength:
        min: 10

  - id: document.no-placeholders
    select:
      target: document
    assert:
      text:
        excludes:
          - "TODO"
          - "TBD"
          - "???"
          - "/absolute/path/to/target-repo"
          - "<brief-id>"
          - "<target-repo>"
          - "<target-branch>"
          - "<checksum>"
          - "EB-0000"
          - "RB-0000"
          - "State what must be achieved"
