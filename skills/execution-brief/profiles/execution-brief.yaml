# Compact execution-ready contract for durable Execution Brief artifacts.
# v2 conditionals keep optional context bounded to the work actually needed.
syntaxVersion: markdown-engine.validation@v2
documentVersion: 1.0.0
rules:
  - id: frontmatter.shape
    select:
      target: document
    assert:
      frontmatterShape:
        presence: required
        fields:
          - field: title
            required: true
            valueType: string
            nonEmpty: true
          - field: brief_id
            required: true
            valueType: string
            nonEmpty: true
          - field: artifact_version
            required: true
            valueType: string
            nonEmpty: true
          - field: status
            required: true
            valueType: string
            nonEmpty: true
          - field: created_at
            required: true
            valueType: string
            nonEmpty: true
          - field: updated_at
            required: true
            valueType: string
            nonEmpty: true
          - field: target_repo
            required: true
            valueType: string
            nonEmpty: true
          - field: target_branch
            required: true
            valueType: string
            nonEmpty: true
          - field: compactness_contract
            valueType: string
            nonEmpty: true

  - id: sections.required.core
    select:
      target: document
    assert:
      sectionsRequired:
        order: strict
        headings:
          - Objective
          - Authoritative Sources
          - Execution Scope
          - Materially Verifiable Success Criteria
          - Execution Plan
          - Validation Gates
          - Stop Conditions
          - Revision Log

  # Advisory target for every brief. Warning diagnostics do not make the
  # aggregate validation result invalid and must not trigger repair by themselves.
  - id: document.source-length.target
    severity: warning
    select:
      target: document
    assert:
      sourceLength:
        max: 10000

  # New and materially revised briefs opt into the hard source budget with
  # `compactness_contract: source-v1`. Legacy briefs migrate lazily.
  - id: document.source-length.maximum
    when:
      select:
        target: document
      assert:
        frontmatterShape:
          fields:
            - field: compactness_contract
              required: true
              valueType: string
              nonEmpty: true
    select:
      target: document
    assert:
      sourceLength:
        max: 14000

  - id: objective.length.compact
    select:
      target: section
      title: Objective
    assert:
      textLength:
        min: 20
        max: 700

  - id: context.or.current-state
    anyOf:
      - label: context-constraints
        select:
          target: list
          section: Context / Constraints
          ordered: false
        assert:
          textLength:
            min: 10
      - label: current-state
        select:
          target: list
          section: Current State
          ordered: false
        assert:
          textLength:
            min: 10

  - id: context.constraints.list
    when:
      select:
        target: section
        title: Context / Constraints
      assert:
        exists: true
    select:
      target: list
      section: Context / Constraints
      ordered: false
    assert:
      textLength:
        min: 10

  - id: current.state.list
    when:
      select:
        target: section
        title: Current State
      assert:
        exists: true
    select:
      target: list
      section: Current State
      ordered: false
    assert:
      textLength:
        min: 10

  - id: authoritative.sources.table
    select:
      target: table
      section: Authoritative Sources
      header:
        - Source
        - Retrieved at
        - Authority
        - Status
        - Controls
    assert:
      tableColumnsRequired:
        columns:
          - Source
          - Retrieved at
          - Authority
          - Status
          - Controls

  - id: authoritative.sources.rows
    select:
      target: tableRow
      section: Authoritative Sources
      tableHeader:
        - Source
        - Retrieved at
        - Authority
        - Status
        - Controls
    assert:
      textLength:
        min: 10

  - id: execution.scope.table
    select:
      target: table
      section: Execution Scope
      header:
        - Scope item
        - Classification
        - Approval impact
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Scope item
          - Classification
          - Approval impact
          - Notes

  - id: execution.scope.rows
    select:
      target: tableRow
      section: Execution Scope
      tableHeader:
        - Scope item
        - Classification
        - Approval impact
        - Notes
    assert:
      textLength:
        min: 10

  - id: success.criteria.list
    select:
      target: list
      section: Materially Verifiable Success Criteria
      ordered: false
    assert:
      textLength:
        min: 10

  - id: review.boundary.frontmatter
    when:
      select:
        target: section
        title: Review Boundary
      assert:
        exists: true
    select:
      target: document
    assert:
      frontmatterShape:
        fields:
          - field: review_boundary_id
            required: true
            valueType: string
            nonEmpty: true

  - id: review.boundary.table
    when:
      select:
        target: section
        title: Review Boundary
      assert:
        exists: true
    select:
      target: table
      section: Review Boundary
      header:
        - Boundary
        - Scope
        - Approval impact
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Boundary
          - Scope
          - Approval impact
          - Notes

  - id: review.boundary.rows
    when:
      select:
        target: section
        title: Review Boundary
      assert:
        exists: true
    select:
      target: tableRow
      section: Review Boundary
      tableHeader:
        - Boundary
        - Scope
        - Approval impact
        - Notes
    assert:
      textLength:
        min: 10

  - id: planned.followup.list
    when:
      select:
        target: section
        title: Planned Follow-up Work
      assert:
        exists: true
    select:
      target: list
      section: Planned Follow-up Work
      ordered: false
    assert:
      textLength:
        min: 10

  - id: execution.plan.ordered-list
    select:
      target: list
      section: Execution Plan
      ordered: true
    assert:
      textLength:
        min: 10

  - id: validation.gates.list
    select:
      target: list
      section: Validation Gates
      ordered: false
    assert:
      textLength:
        min: 10

  - id: stop.conditions.list
    select:
      target: list
      section: Stop Conditions
      ordered: false
    assert:
      textLength:
        min: 10

  - id: review.packet.inputs.table
    when:
      select:
        target: section
        title: Review Packet Inputs
      assert:
        exists: true
    select:
      target: table
      section: Review Packet Inputs
      header:
        - Field
        - Source section
        - Required mapping
        - Notes
    assert:
      tableColumnsRequired:
        columns:
          - Field
          - Source section
          - Required mapping
          - Notes

  - id: review.packet.inputs.rows
    when:
      select:
        target: section
        title: Review Packet Inputs
      assert:
        exists: true
    select:
      target: tableRow
      section: Review Packet Inputs
      tableHeader:
        - Field
        - Source section
        - Required mapping
        - Notes
    assert:
      textLength:
        min: 10

  - id: revision.log.table
    select:
      target: table
      section: Revision Log
      header:
        - Timestamp
        - Actor
        - Change
        - Checksum
    assert:
      tableColumnsRequired:
        columns:
          - Timestamp
          - Actor
          - Change
          - Checksum

  - id: revision.log.rows
    select:
      target: tableRow
      section: Revision Log
      tableHeader:
        - Timestamp
        - Actor
        - Change
        - Checksum
    assert:
      textLength:
        min: 10

  - id: document.no-placeholders
    select:
      target: document
    assert:
      text:
        excludes:
          - "TODO"
          - "TBD"
          - "???"
          - "/absolute/path/to/target-repo"
          - "<brief-id>"
          - "<target-repo>"
          - "<target-branch>"
          - "<checksum>"
          - "EB-0000"
          - "RB-0000"
          - "State what must be achieved"
